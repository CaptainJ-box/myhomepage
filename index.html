<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 업무 도구 모음</title>

    <script>
        /* =====================================================
           ★ 설정값 ★  여기만 고치면 됩니다
           ===================================================== */

        // 만든 사람 이름 (맨 아래에 표시)
        const AUTHOR_NAME = "○○○";

        // 도구 목록: 한 줄 추가하면 카드가 하나 생깁니다
        // ready: false 로 두면 "준비 중" 배지가 붙고 열기 버튼이 잠깁니다
        const TOOLS = [
            { emoji: "🍱", name: "점심 메뉴 룰렛",     desc: "오늘 점심을 대신 정해 드려요",           link: "lunch.html",     ready: true  },
            { emoji: "📄", name: "PDF 병합·분할기",    desc: "여러 PDF를 합치고 나눠요",               link: "pdf-tool.html",  ready: true  },
            { emoji: "📊", name: "자동 데이터 분석기", desc: "파일만 넣으면 분석하고 차트를 추천해요", link: "analyzer.html",  ready: false },
            { emoji: "⚡", name: "전력수요 대시보드",  desc: "공공데이터로 본 우리나라 전력 사용",     link: "dashboard.html", ready: false },
        ];
    </script>

    <!-- 글꼴: Noto Sans KR (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ===== 색상 변수: 다른 도구 페이지와 같은 컨셉 ===== */
        :root {
            --bg: #f6f4ef;           /* 페이지 배경 (따뜻한 미색) */
            --card: #fffdf9;         /* 카드 배경 */
            --point: #1f3a6d;        /* 남색 포인트 */
            --point-dark: #15284f;
            --point-soft: #e9edf4;
            --text: #2b2d33;
            --muted: #6b6f78;
            --line: #e4e0d8;
        }

        * { box-sizing: border-box; }

        /* 기본 글자 크기 (PC 18px, 휴대폰 17px) */
        html { font-size: 18px; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }

        input, button { font-family: inherit; font-size: 1rem; }

        /* ===== 위쪽: 제목, 부제, 검색 ===== */
        header {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 56px 20px 8px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--point);
            line-height: 1.3;
        }
        header p {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .search {
            display: block;
            width: 100%;
            max-width: 520px;
            margin: 28px auto 0;
            padding: 14px 20px;
            background: #ffffff;
            border: 1px solid #d6d1c7;
            border-radius: 999px;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search:focus {
            border-color: var(--point);
            box-shadow: 0 0 0 3px rgba(31, 58, 109, 0.15);
        }

        /* ===== 가운데: 도구 카드 격자 ===== */
        main {
            flex: 1;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 36px 20px 48px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        /* 둥근 카드 */
        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 28px 24px 24px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        /* 마우스를 올리면 살짝 떠오름 (마우스가 있는 기기에서만) */
        @media (hover: hover) {
            .card:hover {
                transform: translateY(-5px);
                border-color: #cfd6e4;
                box-shadow: 0 10px 24px rgba(31, 58, 109, 0.10);
            }
        }

        .card-emoji {
            font-size: 3rem;
            line-height: 1;
            margin-bottom: 16px;
        }
        .card-name {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
        }
        .card-desc {
            flex: 1;
            margin: 6px 0 20px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        /* 준비 중 배지 */
        .badge {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 2px 12px;
            border-radius: 999px;
            background: var(--point-soft);
            color: var(--point);
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* 열기 버튼 */
        .open-btn {
            display: block;
            padding: 11px 0;
            border-radius: 12px;
            background: var(--point);
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            transition: background 0.2s;
        }
        .open-btn:hover { background: var(--point-dark); }

        /* 준비 중인 카드는 흐리게, 버튼은 누를 수 없게 */
        .card.not-ready .card-emoji,
        .card.not-ready .card-name,
        .card.not-ready .card-desc { opacity: 0.6; }
        .open-btn.disabled {
            background: #d9d5cd;
            color: #8a857c;
            cursor: not-allowed;
        }
        .open-btn.disabled:hover { background: #d9d5cd; }

        /* 검색 결과가 없을 때 */
        .empty {
            padding: 48px 0;
            text-align: center;
            color: var(--muted);
        }
        .hidden { display: none; }

        /* ===== 맨 아래 ===== */
        footer {
            padding: 20px 20px 28px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
        }

        /* ===== 휴대폰: 한 줄에 하나 ===== */
        @media (max-width: 560px) {
            html { font-size: 17px; }
            header { padding-top: 40px; }
            header h1 { font-size: 1.8rem; }
            main { padding: 28px 16px 36px; }
            .grid { grid-template-columns: 1fr; gap: 16px; }
        }
    </style>
</head>
<body>

    <!-- 위쪽: 제목과 검색 -->
    <header>
        <h1>나의 업무 도구 모음</h1>
        <p>바이브 코딩으로 직접 만든 업무 도우미</p>
        <input type="search" id="searchInput" class="search" placeholder="도구 이름이나 설명으로 검색" aria-label="도구 검색">
    </header>

    <!-- 가운데: 도구 카드 -->
    <main>
        <div id="toolGrid" class="grid"></div>
        <p id="emptyMessage" class="empty hidden">검색 결과가 없습니다.</p>
    </main>

    <!-- 맨 아래: 만든 사람 -->
    <footer id="footer"></footer>

    <script>
        const toolGrid = document.getElementById('toolGrid');
        const emptyMessage = document.getElementById('emptyMessage');
        const searchInput = document.getElementById('searchInput');

        // 도구 카드 하나 만들기
        function createCard(tool) {
            const card = document.createElement('article');
            card.className = 'card' + (tool.ready ? '' : ' not-ready');

            // 준비 중 배지
            if (!tool.ready) {
                const badge = document.createElement('span');
                badge.className = 'badge';
                badge.textContent = '준비 중';
                card.appendChild(badge);
            }

            // 이모지
            const emoji = document.createElement('div');
            emoji.className = 'card-emoji';
            emoji.textContent = tool.emoji;
            emoji.setAttribute('aria-hidden', 'true');

            // 도구 이름
            const name = document.createElement('h2');
            name.className = 'card-name';
            name.textContent = tool.name;

            // 한 줄 설명
            const desc = document.createElement('p');
            desc.className = 'card-desc';
            desc.textContent = tool.desc;

            // 열기 버튼 (준비 중이면 링크 없이 잠김)
            const btn = document.createElement('a');
            btn.textContent = '열기';
            if (tool.ready) {
                btn.className = 'open-btn';
                btn.href = tool.link;
            } else {
                btn.className = 'open-btn disabled';
                btn.setAttribute('aria-disabled', 'true');
            }

            card.append(emoji, name, desc, btn);
            return card;
        }

        // 검색어에 맞는 카드만 다시 그리기
        function renderTools() {
            const keyword = searchInput.value.trim().toLowerCase();
            const list = TOOLS.filter(tool =>
                (tool.name + ' ' + tool.desc).toLowerCase().includes(keyword)
            );

            toolGrid.innerHTML = '';
            list.forEach(tool => toolGrid.appendChild(createCard(tool)));
            emptyMessage.classList.toggle('hidden', list.length > 0);
        }

        // 검색창에 입력할 때마다 목록 갱신
        searchInput.addEventListener('input', renderTools);

        // 맨 아래 문구 채우기
        document.getElementById('footer').textContent = `만든 사람: ${AUTHOR_NAME} · 2026 바이브 코딩 실습`;

        // 처음 화면 그리기
        renderTools();
    </script>
</body>
</html>
